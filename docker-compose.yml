services:
  api:
    build: .
    container_name: vaga-facil-api
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_ENABLED: 'true'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaga_facil
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/ >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  test-api:
    build: .
    container_name: vaga-facil-test-api
    environment:
      PORT: 3003
      DB_ENABLED: 'true'
      POSTGRES_HOST: postgres_test
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaga_facil_test
      NODE_ENV: test
    ports:
      - '3003:3003'
    depends_on:
      postgres_test:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3003/ >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: vaga-facil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaga_facil
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vaga_facil']
      interval: 5s
      timeout: 3s
      retries: 20

  postgres_test:
    image: postgres:16-alpine
    container_name: vaga-facil-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaga_facil_test
    ports:
      - '5434:5432'
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vaga_facil_test']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  pgdata_test:
